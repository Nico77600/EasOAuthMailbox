<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="300" fill="#f7f4ef"/>
  <text x="40" y="44" fill="#b11f4b" font-size="12" font-weight="700" letter-spacing="1.5">EAS OAUTH MAILBOX  ·  ONE SCENARIO = SOME OF THESE STAGES, IN THIS ORDER</text>
  <g stroke="#dedede" fill="#ffffff">
    <rect x="40" y="70" width="160" height="150" rx="14"/>
    <rect x="232" y="70" width="160" height="150" rx="14"/>
    <rect x="424" y="70" width="160" height="150" rx="14"/>
    <rect x="616" y="70" width="160" height="150" rx="14"/>
    <rect x="808" y="70" width="160" height="150" rx="14"/>
    <rect x="1000" y="70" width="160" height="150" rx="14"/>
  </g>
  <g fill="#b11f4b"><rect x="40" y="70" width="160" height="5" rx="2"/><rect x="232" y="70" width="160" height="5" rx="2"/><rect x="424" y="70" width="160" height="5" rx="2"/><rect x="616" y="70" width="160" height="5" rx="2"/><rect x="808" y="70" width="160" height="5" rx="2"/><rect x="1000" y="70" width="160" height="5" rx="2"/></g>
  <g font-size="11" font-weight="700" fill="#b11f4b"><text x="58" y="100">1 · DISCOVERY</text><text x="250" y="100">2 · OAUTH</text><text x="442" y="100">3 · ENDPOINT</text><text x="634" y="100">4 · FOLDERSYNC</text><text x="826" y="100">5 · IDENTITY</text><text x="1018" y="100">6 · INBOXSYNC</text></g>
  <g font-size="15" font-weight="600" fill="#242424"><text x="58" y="126">No sign-in</text><text x="250" y="126">AD FS token</text><text x="442" y="126">OPTIONS</text><text x="634" y="126">Folders</text><text x="826" y="126">Settings</text><text x="1018" y="126">Sync</text></g>
  <g font-size="12" fill="#5c5c5c">
    <text x="58" y="152">AD FS metadata</text><text x="58" y="170">TLS certificates</text><text x="58" y="188">Bearer challenge</text><text x="58" y="206">Invalid token = 401</text>
    <text x="250" y="152">Device code</text><text x="250" y="170">Audience, scope</text><text x="250" y="188">Expiry, user</text><text x="250" y="206">Token in memory only</text>
    <text x="442" y="152">Token accepted</text><text x="442" y="170">Exchange version</text><text x="442" y="188">Protocol 14.1</text><text x="442" y="206">Commands</text>
    <text x="634" y="152">Hierarchy, Inbox</text><text x="634" y="170">Policy if required:</text><text x="634" y="188">review, or acknowledge</text><text x="634" y="206">when authorised</text>
    <text x="826" y="152">Signed-in user</text><text x="826" y="170">Primary SMTP</text><text x="826" y="188">vs. tested mailbox</text>
    <text x="1018" y="152">Inbox headers</text><text x="1018" y="170">Date, sender, subject</text><text x="1018" y="188">No body, no</text><text x="1018" y="206">attachment</text>
  </g>
  <g stroke="#b11f4b" stroke-width="2" fill="none"><path d="M202 145h26M222 139l6 6-6 6"/><path d="M394 145h26M414 139l6 6-6 6"/><path d="M586 145h26M606 139l6 6-6 6"/><path d="M778 145h26M798 139l6 6-6 6"/><path d="M970 145h26M990 139l6 6-6 6"/></g>
  <g font-size="12" fill="#242424">
    <rect x="40" y="244" width="1120" height="36" rx="10" fill="#ffffff" stroke="#dedede"/>
    <circle cx="62" cy="262" r="5" fill="#16a34a"/><text x="74" y="266">Passed</text>
    <circle cx="140" cy="262" r="5" fill="#d97706"/><text x="152" y="266">Warning</text>
    <circle cx="226" cy="262" r="5" fill="#b11f4b"/><text x="238" y="266">Blocked (policy not authorised)</text>
    <circle cx="438" cy="262" r="5" fill="#dc2626"/><text x="450" y="266">Failed: the following stages are Skipped</text>
    <text x="760" y="266" fill="#5c5c5c">→ console, log file, CSV + JSON + self-contained HTML report</text>
  </g>
</svg>
